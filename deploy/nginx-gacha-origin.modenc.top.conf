# gacha-calendar origin behind nginx.
#
# - gacha-origin.modenc.top is the CDN back-to-origin host
# - gacha.modenc.top answers directly too (bypassing the CDN works)
# - the application sets Cache-Control itself:
#     /api, /healthz        → no-store            (CDN must not cache)
#     /assets/*             → immutable, 1 year   (hashed filenames)
#     index.html            → 60 s, must-revalidate
#     /covers/*, /fallback/* → 24 h
#   nginx passes upstream headers through untouched.

server {
    listen 80;
    listen [::]:80;
    server_name gacha-origin.modenc.top gacha.modenc.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gacha-origin.modenc.top gacha.modenc.top;

    ssl_certificate     /etc/nginx/certs/ccg-origin.modenc.top/cert.cer;
    ssl_certificate_key /etc/nginx/certs/ccg-origin.modenc.top/key.cer;

    client_max_body_size 4M;

    # Never cache API responses or the health check, even if a CDN rule
    # misses; belt and suspenders on top of the app's own no-store.
    location ~ ^/(api|healthz) {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        proxy_hide_header Cache-Control;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
